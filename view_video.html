<!DOCTYPE html>
<html>
<head>
    <title>Video Player</title>
    <style>
        body {
            margin: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            font-family: sans-serif;
        }
        video {
            max-width: 90%;
            max-height: 80vh;
            border: 2px solid #333;
        }
        #controls {
            margin-top: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <video id="vid" src="frontend-development-week1.mp4" controls></video>
    <div id="controls">
        <button onclick="document.getElementById('vid').currentTime -= 5">-5s</button>
        <button onclick="document.getElementById('vid').currentTime += 5">+5s</button>
        <button onclick="playPause()">Play/Pause</button>
        <span id="time">0s</span>
    </div>
    <script>
        const vid = document.getElementById('vid');
        const timeSpan = document.getElementById('time');
        vid.ontimeupdate = () => {
            timeSpan.innerText = vid.currentTime.toFixed(1) + 's / ' + vid.duration.toFixed(1) + 's';
        };
        function playPause() {
            if (vid.paused) vid.play();
            else vid.pause();
        }
    </script>
</body>
</html>
